<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success-neon: #10b981;
            --danger-neon: #ef4444;
            --border-glow: rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 50px var(--border-glow);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }

        .form-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input::placeholder {
            color: #475569;
        }

        /* Removing default browser arrows on numeric inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .results-box {
            margin-top: 32px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .results-box h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .result-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        /* Dynamic coloring depending on the result string */
        .status-low {
            color: var(--success-neon);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .status-high {
            color: var(--danger-neon);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .status-error {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h2>RISK ANALYTICS</h2>
            <p>Artificial Intelligence Credit Evaluation System</p>
        </div>

        <form action="/predict" method="post">
            <div class="form-group">
                <label>Applicant Age</label>
                <input type="number" name="age" required placeholder="e.g. 34">
            </div>

            <div class="form-group">
                <label>Annual Income (USD)</label>
                <input type="number" name="income" required placeholder="e.g. 65000">
            </div>
            
            <div class="form-group">
                <label>Requested Loan Amount</label>
                <input type="number" name="loan_amount" required placeholder="e.g. 12000">
            </div>

            <div class="form-group">
                <label>Credit Bureau Score</label>
                <input type="number" name="credit_score" required placeholder="e.g. 740">
            </div>
            
            <button type="submit" class="submit-btn">Run Risk Assessment</button>
        </form>

        {% if prediction_text %}
            <div class="results-box">
                <h3>Analysis Output</h3>
                <p class="result-text 
                    {% if 'Low Risk' in prediction_text %}status-low
                    {% elif 'High Risk' in prediction_text %}status-high
                    {% else %}status-error{% endif %}">
                    {{ prediction_text }}
                </p>
            </div>
        {% endif %}
    </div>

</body>
</html>
